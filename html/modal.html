<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modal</title>
    <link rel="stylesheet" href="../styles/css/style.css" />
</head>
<body>
    <div class="container">
        <button class="modal-btn" id="clickModalkBtn">Open Modal</button>
      </div>
  
      <div id="modal" class="modal">
        <div class="modal-content">
          <div class="modal-header">
            <Text id="newjob">New Job</Text>
          </div>
          <div class="modal-body">
            <div id="jobContent">Content One</div>
          </div>
          <div class="modal-footer">
            <div class="pagination-container">
              <span class="dot active" id="dotOne"></span>
              <span class="dot" id="dotTwo"></span>
              <span class="dot" id="dotThree"></span>
            </div>
            <button id="nextBtn">Next</button>
          </div>
        </div>
      </div>
  
      <script src="../js/script.js"></script>
</body>
</html>
